aid: gur-de-viaje
name: Gurú de Viaje
description: Gurú de Viaje is a Mexico-based travel-deals company and flight-deal hunter ("cazador de ofertas
  de viaje") that publishes daily cheap-flight promotions and airfare offers so travelers can fly cheaply and
  see the world. Its Spanish-language consumer website and mobile/push experience surface daily discounted
  airline tickets and travel promotions, with a focus on departures from Mexican cities such as Guadalajara
  and Mexico City. Surfaced as a portfolio company of 500 Global and added to the API Evangelist network. As
  of this pass Gurú de Viaje operates a consumer Next.js web property (gurudeviaje.com) and publishes no public
  developer program, API reference, or machine-readable API specification.
